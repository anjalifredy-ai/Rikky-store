<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RikkyStore</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
background:#f3f4f6;
}

header{
background:#111827;
color:white;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

.search{
width:50%;
}

.search input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
}

.products{
padding:25px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.info{
padding:15px;
}

.info h3{
margin-bottom:10px;
}

.price{
color:green;
font-weight:bold;
margin-bottom:10px;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

button{
border:none;
padding:10px;
color:white;
border-radius:8px;
cursor:pointer;
}

.amazon{background:#ff9900}
.flipkart{background:#2874f0}
.myntra{background:#ff3f6c}
.meesho{background:#8e24aa}
</style>
</head>

<body>

<header>
<div class="logo">RikkyStore</div>

<div class="search">
<input type="text" placeholder="Search products...">
</div>
</header>

<div class="products">

<div class="card">
<img src="https://picsum.photos/400/250?1">
<div class="info">
<h3>iPhone 16</h3>
<p class="price">₹79,999</p>

<div class="buttons">
<button class="amazon">Amazon</button>
<button class="flipkart">Flipkart</button>
<button class="myntra">Myntra</button>
<button class="meesho">Meesho</button>
</div>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/400/250?2">
<div class="info">
<h3>Samsung Galaxy S26</h3>
<p class="price">₹69,999</p>

<div class="buttons">
<button class="amazon">Amazon</button>
<button class="flipkart">Flipkart</button>
<button class="myntra">Myntra</button>
<button class="meesho">Meesho</button>
</div>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/400/250?3">
<div class="info">
<h3>Boat Headphones</h3>
<p class="price">₹1,999</p>

<div class="buttons">
<button class="amazon">Amazon</button>
<button class="flipkart">Flipkart</button>
<button class="myntra">Myntra</button>
<button class="meesho">Meesho</button>
</div>
</div>
</div>

</div>

</body>
</html>
